services:
  backend:
    build:
      context: ./backend
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    container_name: telecom-backend
    env_file: .env
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  wecom:
    build: ./backend
    container_name: telecom-wecom
    env_file: .env
    command: ["python", "-m", "app.wecom_client"]
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    profiles: ["wecom"]

  frontend:
    build:
      context: ./frontend
      args:
        BASE_NODE_IMAGE: ${BASE_NODE_IMAGE:-node:20-alpine}
        BASE_NGINX_IMAGE: ${BASE_NGINX_IMAGE:-nginx:alpine}
    container_name: telecom-frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
